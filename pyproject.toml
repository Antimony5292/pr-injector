[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-injector"
version = "0.2.0"
description = "Dynamic bug injection framework via historical PR reversion for AI coding agent evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["benchmark", "bug-injection", "llm", "evaluation", "swe-bench"]

dependencies = [
    "typer[all]>=0.9,<1.0",
    "rich>=13.0,<14.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "gitpython>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    "tree-sitter>=0.24",
    "openai>=1.30",
    "azure-identity>=1.16",
    "unidiff>=0.7,<1.0",
    "orjson>=3.9,<4.0",
    "structlog>=24.0",
    "anyio>=4.0,<5.0",
    "tenacity>=8.0,<10.0",
    "jinja2>=3.1,<4.0",
    "python-dotenv>=1.2.2",
    "datasets>=4.8.4",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
litellm = [
    "litellm>=1.40",
]

languages = [
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
pr-injector = "pr_injector.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_injector"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests", "construction_toolkit/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
